<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de Fundo Premium Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <!-- Brilho de Fundo da Chama -->
    <radialGradient id="fireGlow" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente da Chama Externa (Fogo Vivo) -->
    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dd2800"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>

    <!-- Gradiente da Chama Interna (Núcleo Quente) -->
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff6600"/>
      <stop offset="55%" stop-color="#ffb700"/>
      <stop offset="100%" stop-color="#fff5b0"/>
    </linearGradient>

    <!-- Sombra suave das letras e contornos -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.8" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#ff5500" stroke-width="1.8" stroke-opacity="0.5"/>

  <!-- Brilho quente central -->
  <circle cx="32" cy="23" r="22" fill="url(#fireGlow)"/>

  <!-- FOGUINHO ESTILIZADO (CHAMA DA FÊNIX) -->
  <g transform="translate(0, -1)">
    <!-- Chama Externa -->
    <path d="M 32 6 
             C 36.5 12.5, 45 17, 45 25 
             C 45 32.5, 39 37, 32 37 
             C 25 37, 19 32.5, 19 25 
             C 19 18.5, 25 13.5, 27.5 11 
             C 27.5 14, 29.5 16, 31.5 16 
             C 32.5 12.5, 31 8.5, 32 6 Z" 
          fill="url(#flameOuter)"/>

    <!-- Chama Interna (Núcleo) -->
    <path d="M 32 16.5 
             C 34 20, 39 23, 39 27.5 
             C 39 31.5, 36 34.5, 32 34.5 
             C 28 34.5, 25 31.5, 25 27.5 
             C 25 24, 28.5 21, 30 19 
             C 30.2 20.8, 31.2 21.8, 32 21.2 
             C 32.5 19.5, 31.8 17.8, 32 16.5 Z" 
          fill="url(#flameInner)"/>

    <!-- Faíscas sutis -->
    <circle cx="43.5" cy="13" r="1.2" fill="#ffb700" opacity="0.9"/>
    <circle cx="20.5" cy="15" r="1" fill="#ff6600" opacity="0.8"/>
  </g>

  <!-- LETRAS FG VETORIAIS (F BRANCO, G LARANJA) -->
  <g filter="url(#shadow)">
    <!-- Letra F em Branco Puro (#FFFFFF) -->
    <path d="M 14.5 40 
             H 27.5 
             V 44 
             H 19.5 
             V 46.8 
             H 26 
             V 50.4 
             H 19.5 
             V 56 
             H 14.5 
             Z" 
          fill="#FFFFFF"/>

    <!-- Letra G em Laranja Fênix (#FF5500) -->
    <path d="M 48.5 44.5 
             C 47 41.2, 44.5 39.5, 41 39.5 
             C 36 39.5, 33 43.5, 33 48 
             C 33 52.5, 36 56.5, 41 56.5 
             C 45.5 56.5, 48.5 53.5, 48.5 49.5 
             H 41.5 
             V 46 
             H 53 
             V 50 
             C 53 54.5, 48 59.5, 41 59.5 
             C 33.5 59.5, 28.5 54, 28.5 48 
             C 28.5 42, 33.5 36.5, 41 36.5 
             C 45.8 36.5, 49.8 39, 52 42.5 
             Z" 
          transform="scale(0.92) translate(4.5, 2.5)"
          fill="#FF5500"/>
  </g>
</svg>